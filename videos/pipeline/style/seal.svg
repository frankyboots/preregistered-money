<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- seal mark — style spec v1.0.0 §4.2.
       Certification-stamp archetype: single stroke weight, double ring.
       Wordmark text is a PLACEHOLDER until the channel name is decided
       (owner decision, style-spec §11.1). Stroke color: var(--paper) on
       ink; the seal scene uses var(--seal-amber) for the SHA only. -->
  <circle cx="120" cy="120" r="108" fill="none" stroke="#E8E6E1" stroke-width="8"/>
  <circle cx="120" cy="120" r="92"  fill="none" stroke="#E8E6E1" stroke-width="2"/>
  <text x="120" y="132" text-anchor="middle"
        font-family="'JetBrains Mono', monospace" font-size="26"
        letter-spacing="3" fill="#E8E6E1">PREREG</text>
</svg>
