<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- brand mark — style spec v1.1.0 §4.2 (owner decision 2026-09-12).
       Certification stamp holding the bar: double ring (single-stroke
       weights, per the seal archetype), an ascending paper line crossing
       a seal-amber horizontal — the line rises left→right and ends above
       the bar: alpha over benchmark, the mark reads as a pass. This is
       the channel's profile logo and the mark used in the seal scene.
       Colors are the pinned tokens: --paper #E8E6E1, --seal-amber
       #C89B3C. No other colors. Coordinates mirror seal_mark() in
       brand/gen_concepts.py (viewBox -400..400 shifted +400). -->
  <circle cx="400" cy="400" r="330" fill="none" stroke="#E8E6E1" stroke-width="18"/>
  <circle cx="400" cy="400" r="282" fill="none" stroke="#E8E6E1" stroke-width="4"/>
  <line x1="230" y1="420" x2="570" y2="420" stroke="#C89B3C" stroke-width="7"/>
  <polyline points="250,495 385,410 550,295" fill="none" stroke="#E8E6E1"
            stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
