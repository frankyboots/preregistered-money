<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="style/tokens.css" />
    <link rel="stylesheet" href="style/setpieces.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      body { font-family: "Inter", sans-serif; }
      code, pre, .monospace { font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body>
    <!--
      Master assembly root. Mount scene compositions here in spec order, e.g.:

      <div data-composition-id="scene-01" data-composition-src="composition/scene-01.html"
           data-start="0" data-duration="10" data-track-index="1"></div>

      Scene files live in composition/ — one HTML per scene (CONCEPT §4).
      The style tokens for this video come from the pipeline style spec
      (versions pinned in build.log); don't hardcode palettes per scene.
    -->
    <div id="scene-01" data-composition-id="scene-01" data-composition-src="composition/scene-01.html"
         data-start="0" data-duration="2.69" data-width="1920" data-height="1080" data-track-index="1"></div>
    <div id="scene-02" data-composition-id="scene-02" data-composition-src="composition/scene-02.html"
         data-start="2.69" data-duration="25.17" data-width="1920" data-height="1080" data-track-index="2"></div>
    <div id="scene-03" data-composition-id="scene-03" data-composition-src="composition/scene-03.html"
         data-start="27.86" data-duration="33.57" data-width="1920" data-height="1080" data-track-index="3"></div>
    <div id="scene-04" data-composition-id="scene-04" data-composition-src="composition/scene-04.html"
         data-start="61.43" data-duration="33.81" data-width="1920" data-height="1080" data-track-index="4"></div>
    <div id="scene-05" data-composition-id="scene-05" data-composition-src="composition/scene-05.html"
         data-start="95.24" data-duration="33.33" data-width="1920" data-height="1080" data-track-index="5"></div>
    <div id="scene-06" data-composition-id="scene-06" data-composition-src="composition/scene-06.html"
         data-start="128.57" data-duration="33.49" data-width="1920" data-height="1080" data-track-index="6"></div>
    <div id="scene-07" data-composition-id="scene-07" data-composition-src="composition/scene-07.html"
         data-start="162.06" data-duration="43.41" data-width="1920" data-height="1080" data-track-index="7"></div>
    <div id="scene-08" data-composition-id="scene-08" data-composition-src="composition/scene-08.html"
         data-start="205.47" data-duration="30.13" data-width="1920" data-height="1080" data-track-index="8"></div>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080"></div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Master timeline: scene mounting + inter-scene transitions go here.
      // Per-scene timelines live inside each composition file.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
